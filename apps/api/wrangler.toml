name = "blinds-nisa-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
# nodejs_compat: @react-pdf/renderer needs Node Buffer/stream shims
compatibility_flags = ["nodejs_compat"]

[triggers]
# 06:00 UTC — auto-expire stale estimates.
# 14:00 UTC — customer emails at 10 AM Toronto (EDT; 9 AM during EST):
#             day-before appointment/installation reminders + review
#             requests 2 days after an order is marked installed.
# * * * * * — Titan inbox sync tick (lib/inbox/schedule.ts decides: every
#             minute 08:00–22:00 Toronto, every 10th minute otherwise).
#             Must match INBOX_SYNC_CRON.
crons = ["0 6 * * *", "0 14 * * *", "* * * * *"]

[vars]
ENVIRONMENT = "development"
TITAN_IMAP_HOST = "imap.titan.email"
TITAN_IMAP_PORT = "993"

# Secrets (set via `wrangler secret put`):
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# RESEND_API_KEY
# APP_URL
# RESEND_FROM       (e.g. "Blinds Nisa <estimates@blindsnisa.com>")
# RESEND_REPLY_TO   (e.g. "info@blindsnisa.com")
# ETRANSFER_WEBHOOK_SECRET  (shared with the Gmail Apps Script)
# TITAN_IMAP_USER           (e.g. "info@blindsnisa.com" — the inbox sync)
# TITAN_IMAP_PASSWORD       (that mailbox's password; sync is skipped until set)
